version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: souls-db
    environment:
      POSTGRES_USER: souls_user
      POSTGRES_PASSWORD: souls_password
      POSTGRES_DB: souls_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souls_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: souls-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SOULS Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: souls-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://souls_user:souls_password@postgres:5432/souls_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-secret-key-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: souls-network
